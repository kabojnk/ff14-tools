<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Primary favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XIV Tools" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android / Chrome PWA -->
    <meta name="theme-color" content="#2f3137" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- First paint: apply the stored theme before anything renders (mirrors uiStore's initialTheme
         and src/lib/themes.ts THEME_IDS), and give the status bar the disguise colour if the app opens disguised. -->
    <script>
      (function () {
        var ids = ['light', 'dark', 'midnight', 'latte', 'mocha', 'sakura', 'dawn', 'rosepine', 'dracula', 'nord', 'tokyo'];
        var theme = null;
        var eep = false;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        try { eep = sessionStorage.getItem('eepMode') === 'true'; } catch (e) {}
        // A phone that has a PIN launches disguised (mirrors uiStore's launchState).
        try { if (localStorage.getItem('hasPin') === '1' && window.matchMedia('(pointer: coarse)').matches) eep = true; } catch (e) {}
        if (ids.indexOf(theme) < 0) {
          var dark = true;
          try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
          theme = dark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (eep) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1430');
          document.documentElement.style.backgroundColor = '#0b1430';
        }
      })();
    </script>

    <!-- General -->
    <meta name="description" content="FF14 team chat and tools" />
    <meta name="application-name" content="XIV Tools" />

    <title>XIV Tools</title>
  </head>
  <body>
    <!-- Shown synchronously on pagehide so the app switcher snapshot hides the chat (the disguise, Aetherdesk) -->
    <div id="privacy-screen" style="display:none;position:fixed;inset:0;z-index:99999;background:radial-gradient(120% 90% at 10% 0%,#1d4a8a 0%,transparent 55%),radial-gradient(90% 80% at 100% 30%,#3b2a7a 0%,transparent 60%),linear-gradient(180deg,#14305c,#0b1430);flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;">
      <div style="color:#5fd4ff;font-size:0.75rem;font-weight:650;letter-spacing:0.09em;text-transform:uppercase;">Aetherdesk</div>
      <div style="color:#eef4ff;font-size:1.375rem;font-weight:680;">Today in Eorzea</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
