<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Primary favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XIV Tools" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android / Chrome PWA -->
    <meta name="theme-color" content="#2f3137" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- First paint: apply the stored theme before anything renders (mirrors uiStore's initialTheme
         and src/lib/themes.ts THEME_IDS), and give the status bar the disguise colour if eep mode is on. -->
    <script>
      (function () {
        var ids = ['light', 'dark', 'midnight', 'latte', 'mocha', 'sakura', 'dawn', 'rosepine', 'dracula', 'nord', 'tokyo'];
        var theme = null;
        var eep = false;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        try { eep = sessionStorage.getItem('eepMode') === 'true'; } catch (e) {}
        if (ids.indexOf(theme) < 0) {
          var dark = true;
          try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
          theme = dark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (eep) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1a2e');
      })();
    </script>

    <!-- General -->
    <meta name="description" content="FF14 team chat and tools" />
    <meta name="application-name" content="XIV Tools" />

    <title>XIV Tools</title>
  </head>
  <body>
    <!-- Shown synchronously on pagehide so the app switcher snapshot hides the chat -->
    <div id="privacy-screen" style="display:none;position:fixed;inset:0;z-index:99999;background:#1a1a2e;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
      <div style="color:#e94560;font-size:1.25rem;font-weight:700;">FF14 Random Content Running Agenda Picker</div>
      <div style="color:#a0a0b0;font-size:0.875rem;">Can't decide what to run? Let fate choose!</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
