name: CI

on:
  push:
    branches: [main] # PR branches are covered by pull_request; pushing both ran everything twice
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  e2e:
    needs: check
    runs-on: ubuntu-24.04 # pinned: the theme screenshot baselines are rendered on it
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit

      - name: Start local Supabase (applies migrations + seed)
        run: npm run db:start

      - name: Database tests (pgTAP)
        run: npm run test:db

      - name: Migration test (old-shape history → conversations)
        run: npm run test:migration # ends with a db reset, so the seed is back for e2e

      - name: Run e2e
        run: npx playwright test --project=chromium-desktop --project=webkit-iphone
        env:
          CI: 'true'
          E2E_SKIP_RESET: '1' # test:migration's final reset re-applied migrations + seed

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Theme screenshots: compared with the committed baselines; any missing baseline is written
      # (and passes), so the first run produces them. Resets the database first for a known seed.
      # See SETUP.md, "Screenshot baselines".
      - name: Theme screenshots
        if: ${{ !cancelled() }}
        run: npx playwright test --project=screenshots-desktop --project=screenshots-phone --update-snapshots=missing
        env:
          CI: 'true'

      - name: Upload screenshot baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: e2e/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
