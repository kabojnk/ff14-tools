name: CI

on:
  push:
    branches: [main] # PR branches are covered by pull_request; pushing both ran everything twice
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit

      - name: Start local Supabase (applies migrations + seed)
        run: npm run db:start

      - name: Database tests (pgTAP)
        run: npm run test:db

      - name: Migration test (old-shape history → conversations)
        run: npm run test:migration # ends with a db reset, so the seed is back for e2e

      - name: Run e2e
        run: npm run e2e
        env:
          CI: 'true'
          E2E_SKIP_RESET: '1' # test:migration's final reset re-applied migrations + seed

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
