server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The iOS app's live updates. The manifest is never cached; a bundle never changes once published.
    # The app's web view (origin capacitor://localhost) fetches the manifest, so it needs CORS; the zip
    # is downloaded natively and doesn't.
    location = /native/latest.json {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "capacitor://localhost" always;
        # A location with its own add_header drops the server-level ones, so repeat them.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location /native/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # A location with its own add_header drops the server-level ones, so repeat them.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Saving media (src/lib/saveMedia.ts): the CDN sends CORS headers only for some file types, so the app
    # fetches the others (.mov, .m4a, .pdf…) through here, same-origin. It reaches only the CDN: the host is
    # fixed when the image is built (docker/Dockerfile puts it in for __BUNNY_CDN_HOST__), and only GET
    # (and HEAD) pass. This file is an nginx:alpine template: the image fills in NGINX_LOCAL_RESOLVERS (the
    # container's DNS servers) when it starts.
    location /cdn-proxy/ {
        limit_except GET { deny all; }
        # Looked up as it's used (cached for 5 minutes), not once at startup: the CDN's addresses change.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $cdn_host "__BUNNY_CDN_HOST__";
        rewrite ^/cdn-proxy(/.*)$ $1 break;
        proxy_pass https://$cdn_host;
        proxy_set_header Host $cdn_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $cdn_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Nothing of the visitor's goes to the CDN, and nothing of the CDN's comes back as a cookie.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        # Streamed through, not spooled to disk: videos can be large.
        proxy_buffering off;
        # A location with its own add_header drops the server-level ones, so repeat them.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
